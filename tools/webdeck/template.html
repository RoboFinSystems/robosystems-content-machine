<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>{{TICKER}} webdeck</title>
<style>
{{TOKENS_CSS}}
{{FONTS_CSS}}

/* ============================================================
   Webdeck stage - 1920x1080 fixed, every animation is a pure
   function of time driven by window.__seek(t). No CSS
   animations/transitions anywhere: deterministic frame capture.

   Motion follows tools/motion/README.md: each row, bar, card or
   bullet appears as the narration names it (word timings from
   align_words.py), the element being spoken about takes the focus
   fill, a slow push runs toward it, headlines blur in word by
   word, and every cut fades content into the one shared backdrop.
   No glows, shadows, colour filters or black dips.
   ============================================================ */
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#000; }
#stage {
  position:relative; width:1920px; height:1080px; overflow:hidden;
  background:var(--stage-bg);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}

/* the shared backdrop: a flat brand gradient over a faint grid, identical under
   every shot, so a cut is content fading into it, never a dip */
#bg { position:absolute; inset:0; z-index:0;
  background:linear-gradient(135deg, rgba(30,58,138,.28), rgba(15,23,42,0) 55%, rgba(23,46,71,.30)); }
#grid { position:absolute; inset:0; z-index:0; opacity:.05;
  background-image:linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
  background-size:64px 64px; }

.slide { position:absolute; inset:0; opacity:0; z-index:1; will-change:opacity; }
.cam { position:absolute; inset:0; will-change:transform; }

/* ---- shared chrome ---- */
.eyebrow { position:absolute; left:150px; top:106px;
  font-family:var(--font-display); font-weight:600; font-size:26px;
  letter-spacing:.24em; text-transform:uppercase; }
.eyebrow .num { color:var(--accent); }
.eyebrow .sep { color:var(--text-faint); padding:0 14px; }
.eyebrow .lbl { color:#5f6d89; }

.footer { position:absolute; left:150px; right:150px; bottom:104px; }
.footer .rule { border-top:1px solid var(--border-hairline); margin-bottom:32px; }
.footer .row { display:flex; justify-content:space-between; align-items:center; }
.footer .src { font-size:24px; color:var(--text-muted); }
.footer .lockup { display:flex; align-items:center; gap:13px; }
.footer .lockup img { height:31px; display:block; opacity:.85; }
.footer .lockup span { font-size:27px; font-weight:600; color:#a9b3c6; letter-spacing:.01em; }

/* ---- title / hook ---- */
.t-headline { position:absolute; left:150px; top:186px; width:1630px;
  font-family:var(--font-display); font-weight:800; font-size:118px;
  line-height:1.07; letter-spacing:var(--tracking-display); color:var(--text-primary); }
.t-headline.fit2 { }
.t-headline .w { display:inline-block; will-change:opacity,transform; }
.t-subhead { position:absolute; left:150px; width:1500px;
  font-size:44px; color:#98a4ba; font-weight:400; }
.t-pill { position:absolute; left:150px; display:inline-block;
  background:var(--accent); color:#fff; border-radius:999px;
  padding:16px 30px; font-family:var(--font-display); font-weight:600;
  font-size:22px; letter-spacing:.14em; text-transform:uppercase; }

/* watch variant (bottom line) */
.watch-label { position:absolute; left:150px;
  font-family:var(--font-display); font-weight:600; font-size:26px;
  letter-spacing:.24em; color:var(--text-faint); text-transform:uppercase; }
.watch-chips { position:absolute; left:150px; width:1630px; display:flex; flex-wrap:wrap; gap:28px; }
.watch-chip { background:var(--surface-card); border:1px solid var(--border-hairline);
  border-radius:16px; padding:22px 36px; font-size:31px; font-weight:500; color:var(--text-body); }

/* ---- content slides (chart/cards/dual) ---- */
.c-headline { position:absolute; left:150px; top:158px; width:1630px;
  font-family:var(--font-display); font-weight:800; font-size:92px; white-space:nowrap;
  line-height:1.05; letter-spacing:var(--tracking-display); color:var(--text-primary); }
.c-subhead { position:absolute; left:150px; top:292px; width:1500px;
  font-size:40px; color:#8b98af; font-weight:400; }

/* bar chart */
.bars { position:absolute; left:150px; right:150px; top:400px; bottom:230px; display:flex;
  align-items:flex-end; gap:36px; }
.barcol { position:relative; flex:1; height:100%; }
.bar { position:absolute; left:0; right:0; bottom:56px; border-radius:14px;
  background:#182238; will-change:height; }
.bar.hl { background:var(--accent); }
.bar.neg { background:#3a1b26; }
.bar.neg.hl { background:var(--data-negative); }
.bar-zero { position:absolute; left:0; right:0; height:2px;
  background:rgba(255,255,255,.16); opacity:0; }
.bar-val { position:absolute; left:0; right:0; text-align:center;
  font-weight:600; font-size:31px; color:var(--text-primary); }
.bar-val.hl { color:var(--blue-400); }
.bar-val.neg { color:var(--data-negative); }
.bar-x { position:absolute; left:0; right:0; bottom:0; text-align:center;
  font-size:29px; color:#7d8aa1; }
.bar-x.hl { color:var(--text-primary); font-weight:600; }

/* line chart */
.linewrap { position:absolute; left:150px; right:150px; top:430px; bottom:230px; }
.linewrap svg { position:absolute; inset:0; overflow:visible; }
.line-xrow { position:absolute; left:0; right:0; bottom:0; height:56px;
  border-top:1px solid var(--border-hairline); }
.line-x { position:absolute; top:18px; font-size:29px; color:#7d8aa1; transform:translateX(-50%); }
.line-x:first-child { transform:none; }
.line-lbl { position:absolute; font-weight:600; font-size:31px; color:var(--blue-400);
  transform:translate(-100%,-140%); white-space:nowrap; }

/* metric cards */
.cards { position:absolute; left:150px; right:150px; top:428px; bottom:232px;
  display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:34px; }
.card { position:relative; background:#101a2e; border:1.5px solid var(--border-hairline);
  border-radius:20px; padding:28px 44px; will-change:opacity,transform; overflow:hidden; }
.card.hl { border-color:rgba(59,122,245,.75); }
.card .lb { font-size:29px; color:#93a0b6; }
.card .vl { margin-top:8px; font-family:var(--font-display); font-weight:800; white-space:nowrap;
  font-size:62px; letter-spacing:.01em; color:var(--text-primary); }
.card.hl .vl { color:var(--accent); }
.card .ch { margin-top:10px; font-size:25px; font-weight:500; }

/* dual: bullets left + stats right */
.bullets { position:absolute; left:150px; top:408px; width:830px; }
.bullet { position:relative; padding-left:44px; margin-bottom:30px;
  font-size:33px; line-height:1.32; color:#b6c1d4; will-change:opacity,transform; }
.bullet .mk { position:absolute; left:0; top:0; color:var(--accent); font-weight:700; }
.bullet.hl { color:var(--text-primary); font-weight:600; font-size:34px; }
.bullet .sc { font-family:var(--font-display); font-weight:600; font-size:34px; margin-right:18px; }

/* minmax(0,1fr), not 1fr: a bare 1fr track is minmax(auto,1fr), so a wide nowrap value
   grew the column past the grid box and the cards painted off the right of the slide.
   Worse, it defeated the autofit shrink pass below, which measured the already-widened
   card, concluded the text fit, and did nothing. Capping the track restores that pass.
   (MGPI Q2 2026 segment cards, "$59.6M sales", clipped mid-word.) */
.ministats { position:absolute; left:1010px; right:150px; top:420px;
  display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:34px; }
.mini { position:relative; background:#101a2e; border:1.5px solid var(--border-hairline);
  border-radius:20px; padding:30px 36px; min-height:210px; will-change:opacity,transform;
  overflow:hidden; }
.mini.hl { border-color:rgba(59,122,245,.75); }
.mini .lb { font-size:25px; color:#93a0b6; }
.mini .vl { margin-top:12px; font-family:var(--font-display); font-weight:700;
  font-size:56px; color:var(--text-primary); white-space:nowrap; }
.mini .vl .pre { font-family:var(--font-body); font-weight:500; font-size:38px; color:#c3ccdb; }
.mini.hl .vl { color:var(--accent); }
.mini .sb { margin-top:10px; font-size:23px; color:#8593aa; }
.mini .sb.warm { color:var(--data-warning); }

.statpanel { position:absolute; left:1030px; right:150px; top:404px;
  background:#0f1830; border:1.5px solid var(--border-hairline); border-radius:24px;
  padding:14px 48px; }
.staterow { display:flex; justify-content:space-between; align-items:center;
  padding:26px 0; border-bottom:1px solid rgba(28,41,66,.8); will-change:opacity,transform; }
.staterow:last-child { border-bottom:none; }
.staterow .lb { font-size:31px; color:#93a0b6; max-width:330px; line-height:1.25; }
.staterow .vl { font-family:var(--font-display); font-weight:700; font-size:42px;
  color:var(--text-primary); white-space:nowrap; }
.staterow .vl .paren { font-family:var(--font-body); font-weight:400; font-size:24px; color:#68758f; }
.staterow.hl .lb { color:var(--accent); font-weight:600; }
.staterow.hl .vl { color:var(--blue-400); }

/* comparison table */
.tbl { position:absolute; left:150px; right:150px; top:430px; }
.tbl-head { display:flex; padding:0 36px 20px; }
.tbl-head .th { font-family:var(--font-display); font-weight:600; font-size:25px;
  letter-spacing:.18em; text-transform:uppercase; color:#7d8aa1; }
.tbl-head .th.last { color:var(--accent); }
.tbl-rule { border-top:2px solid var(--border-strong); }
.tbl-row { display:flex; align-items:center; padding:0 36px; border-radius:12px;
  border-bottom:1px solid rgba(28,41,66,.8); will-change:opacity,transform; }
.tbl .c0 { flex:1.6; text-align:left; }
.tbl .c { flex:1; text-align:right; }
.tbl-row .td0 { font-size:34px; font-weight:500; color:#e8edf5; }
.tbl-row .td { font-size:31px; color:#8593aa; }
.tbl-row .td.last { font-weight:600; color:var(--text-primary); }

/* callout */
.k-kicker { position:absolute; left:0; right:0; text-align:center;
  font-family:var(--font-display); font-weight:600; font-size:34px;
  letter-spacing:.18em; text-transform:uppercase; color:#a5b1c5; }
.k-big { position:absolute; left:145px; right:145px; text-align:center;
  font-family:var(--font-display); font-weight:800; font-size:188px; white-space:nowrap;
  letter-spacing:.01em; will-change:opacity,transform; }
.k-ctx { position:absolute; left:370px; width:1180px; text-align:center;
  font-size:36px; line-height:1.5; color:var(--text-body); }
.k-rule { position:absolute; left:810px; width:300px; height:4px; border-radius:2px;
  background:linear-gradient(90deg, var(--blue-500), var(--blue-400)); transform-origin:center; }

/* cta */
.cta-mark { position:absolute; left:0; right:0; display:flex; justify-content:center; }
.cta-mark img { height:120px; }
.cta-word { position:absolute; left:145px; right:145px; text-align:center; white-space:nowrap;
  font-family:var(--font-display); font-weight:700; font-size:128px; color:var(--text-primary); }
.cta-sub { position:absolute; left:410px; width:1100px; text-align:center;
  font-size:44px; line-height:1.4; color:#8b98af; }
.cta-btn { position:absolute; left:0; right:0; display:flex; justify-content:center; }
.cta-btn span { background:var(--accent); color:#fff; border-radius:14px;
  padding:24px 52px; font-size:38px; font-weight:600; }
.cta-fine { position:absolute; left:0; right:0; bottom:96px; text-align:center;
  font-size:25px; color:var(--text-faint); }

/* focus: the element the narration is on. A fill and an accent edge that
   crossfade in and out with the voice; never a glow. */
.focus-fill { position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:rgba(59,122,245,.11); opacity:0; }
.focus-edge { position:absolute; left:0; top:12%; bottom:12%; width:5px; border-radius:3px;
  background:var(--accent); opacity:0; }
.tbl-row, .bullet, .staterow { position:relative; }

/* poster */
#poster { position:absolute; inset:0; z-index:60; display:none; }
#poster img { width:1920px; height:1080px; object-fit:cover; display:block; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="grid"></div>
  <div id="sections"></div>
  <div id="poster"><img src="{{POSTER_SRC}}"></div>
</div>

<script>
const DATA = {{DATA_JSON}};

/* ---------- easing + helpers (pure) ---------- */
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const eoc = x => 1 - Math.pow(1 - clamp01(x), 3);        // easeOutCubic
const eoq = x => 1 - Math.pow(1 - clamp01(x), 5);        // easeOutQuint
const eio = x => { x = clamp01(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
const seg = (t, d, dur) => clamp01((t - d) / dur);        // 0..1 window

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

// NEVER read chart categories with a bare Object.entries. JS enumerates integer-like keys
// numerically before string keys, so {"2026 (6 mo left)","2027","2028","2029","2030 and after"}
// comes back 2027, 2028, 2029, 2026, 2030 - chronology broken. It hides on all-bare-year
// charts because those happen to sort correctly. build_webdeck.py records the authored order
// as slide.dataOrder; fall back to Object.entries for decks built before that existed.
function dataEntries(slide) {
  const d = (slide && slide.data) || {};
  const order = slide && slide.dataOrder;
  if (Array.isArray(order) && order.length) return order.map(k => [k, d[k]]);
  return Object.entries(d);
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* number count-up: parse "$12.56B" / "33.4%" / "~$12.5B" / "+2%" */
function parseCountable(s) {
  const m = String(s).match(/^([~+\-$≈about ]*)(\d[\d,]*(?:\.\d+)?)([BMKx×%]{0,2})$/);
  if (!m) return null;
  const num = parseFloat(m[2].replace(/,/g,''));
  const dec = (m[2].split('.')[1] || '').length;
  return { prefix:m[1], num, dec, suffix:m[3] };
}
function countText(spec, p) {
  const v = spec.num * p;
  let s = v.toFixed(spec.dec);
  if (spec.num >= 1000) s = Number(s).toLocaleString('en-US');
  return spec.prefix + s + spec.suffix;
}


/* ---------- motion primitives (tracks: fn(localT) per section) ---------- */
function rise(node, delay, dur=0.6, dist=26) {
  return t => { const p = eoc(seg(t, delay, dur));
    node.style.opacity = p;
    node.style.transform = `translateY(${(1-p)*dist}px)`; };
}
function fadeIn(node, delay, dur=0.5) {
  return t => { node.style.opacity = eoc(seg(t, delay, dur)); };
}
/* headline entrance: blur to sharp, rising (the landing kit's blurIn) */
function blurIn(node, delay, dur=0.65, dist=22) {
  return t => { const x = seg(t, delay, dur), e = eoc(x);
    node.style.opacity = clamp01(x * 1.4);
    node.style.filter = e < 1 ? `blur(${(1-e)*14}px)` : '';
    node.style.transform = `translateY(${(1-e)*dist}px)`; };
}
function countUp(node, target, delay, dur=1.15) {
  const spec = parseCountable(target);
  if (!spec) { node.textContent = target; return fadeIn(node, delay, 0.5); }
  node.textContent = target;   // final text present at build so autofit sees worst case
  return t => { const p = eoc(seg(t, delay, dur));
    node.style.opacity = p === 0 ? 0 : 1;
    node.textContent = p >= 1 ? target : countText(spec, p); };
}

/* ---------- cues: build to the voice ----------
   sec.words is [[token, t], ...], section-local, from align_words.py. An element's
   cue is where the narration names it: an authored phrase (slide.cues[i]) if there
   is one, else the first significant word of its label, searched forward from the
   previous cue. Anything unmatched is spread between its matched neighbours, so a
   deck without word timings still builds across the narration, not all at once. */
const STOP = new Set(['the','a','an','of','and','or','to','in','on','for','at','by','from',
  'with','net','total','its','per','vs','as','is','q1','q2','q3','q4','fy']);
const normw = w => String(w).toLowerCase().replace(/[^a-z0-9]/g, '');
function sigWords(label) {
  return String(label).split(/[\s/,()\-]+/).map(normw)
    .filter(w => w.length > 2 && !STOP.has(w) && !/^\d+$/.test(w));
}
function findPhrase(words, phrase, from) {
  const want = String(phrase).split(/\s+/).map(normw).filter(Boolean);
  if (!want.length) return -1;
  for (let i = from; i <= words.length - want.length; i++) {
    if (want.every((w, k) => normw(words[i + k][0]) === w)) return i;
  }
  return -1;
}
const LEAD = 0.25;   // the picture arrives a beat before the word
function cueTimes(sec, labels, { from = 1.0, until } = {}) {
  const words = sec.words || [];
  const aOff = sec.audioStart - sec.start;
  const end = until != null ? until : aOff + sec.audioDur * 0.8;
  const authored = sec.slide.cues || [];
  const idx = labels.map(() => -1);
  let cursor = 0;
  labels.forEach((lab, i) => {
    let at = -1;
    if (authored[i]) at = findPhrase(words, authored[i], cursor);
    if (at < 0) for (const w of sigWords(lab)) {
      const k = findPhrase(words, w, cursor);
      if (k >= 0) { at = k; break; }
    }
    if (at >= 0) { idx[i] = at; cursor = at + 1; }
  });
  const times = idx.map(k => k >= 0 ? Math.max(from, words[k][1] - LEAD) : null);
  // spread the unmatched between their matched neighbours
  for (let i = 0; i < times.length; i++) {
    if (times[i] != null) continue;
    let j = i; while (j < times.length && times[j] == null) j++;
    const lo = i === 0 ? from : times[i - 1];
    const hi = j < times.length ? times[j] : Math.max(lo + 0.6 * (j - i), end);
    for (let k = i; k < j; k++) times[k] = lo + (hi - lo) * (k - i + 1) / (j - i + 1);
    i = j;
  }
  // keep order monotonic: a cue never lands before the one ahead of it
  for (let i = 1; i < times.length; i++) times[i] = Math.max(times[i], times[i - 1] + 0.3);
  return times;
}

/* focus: the element being spoken about takes the fill + edge from its cue until
   the next one, then hands off; after the last, the authored highlight keeps it. */
function addFocus(node, withEdge=true) {
  const f = el('div','focus-fill'); node.appendChild(f);
  let e = null;
  if (withEdge) { e = el('div','focus-edge'); node.appendChild(e); }
  return { fill: f, edge: e, node };
}
function focusTrack(items, times, holdIdx, settle) {
  /* weight of item i at t: fades in over 0.35s at its cue, out at the next cue;
     from `settle` on, only holdIdx (the authored highlight) keeps it */
  return t => items.forEach((it, i) => {
    const a = times[i], b = i + 1 < times.length ? times[i + 1] : settle;
    let w = eoc(seg(t, a, 0.35)) * (1 - eoc(seg(t, b, 0.35)));
    if (i === holdIdx) w = Math.max(w, eoc(seg(t, settle, 0.5)));
    it.fill.style.opacity = w;
    if (it.edge) it.edge.style.opacity = w;
  });
}
/* "value (note)" or "prefix 45% rest" -> {main, note}; the numeric token animates */
function splitValue(v) {
  v = String(v).trim();
  const m = v.match(/^(.*?)\s*\((.*)\)$/);
  if (m) return { main: m[1], note: m[2] };
  const toks = v.split(/\s+/);
  for (let i = 0; i < toks.length; i++) {
    if (parseCountable(toks[i])) {
      return { main: toks.slice(0, i + 1).join(' '), note: toks.slice(i + 1).join(' ') };
    }
  }
  return { main: v, note: '' };
}
/* render main into node: static word prefix + counting numeric tail */
function buildValue(node, main, delay, dur, tracks) {
  const m = main.match(/^(.*?)(\S+)$/);
  if (m && m[1] && parseCountable(m[2])) {
    node.innerHTML = `<span class="pre">${esc(m[1])}</span><span class="ct"></span>`;
    tracks.push(countUp(node.querySelector('.ct'), m[2], delay, dur));
    tracks.push(fadeIn(node, delay, 0.4));
  } else {
    tracks.push(countUp(node, main, delay, dur));
  }
}

/* ---------- chrome builders ---------- */
function addEyebrow(root, tracks, sec) {
  if (!sec.eyebrow) return;
  const [num, lbl] = sec.eyebrow;
  const e = el('div','eyebrow',
    `<span class="num">${esc(num)}</span><span class="sep">/</span><span class="lbl">${esc(lbl)}</span>`);
  root.appendChild(e);
  tracks.push(blurIn(e, 0.15, 0.6, 12));
}
function addFooter(root, tracks, sec, delay=1.15) {
  if (!sec.slide.source && !DATA.lockupSrc) return;
  const f = el('div','footer');
  f.appendChild(el('div','rule'));
  const row = el('div','row');
  row.appendChild(el('div','src', esc(sec.slide.source || '')));
  row.appendChild(el('div','lockup', `<img src="${DATA.markSrc}"><span>RoboSystems</span>`));
  f.appendChild(row);
  root.appendChild(f);
  tracks.push(fadeIn(f, delay, 0.6));
}
function addHeadline(root, tracks, sec, cls, top) {
  const h = el('div', cls);
  h.style.top = top + 'px';
  const words = String(sec.slide.headline).split(' ');
  words.forEach((w, k) => {
    const s = el('span','w', esc(w));
    h.appendChild(s);
    if (k < words.length - 1) h.appendChild(document.createTextNode(' '));
    tracks.push(blurIn(s, 0.2 + k*0.07, 0.65, 22));
  });
  root.appendChild(h);
  h.classList.add('autofit');
  return h;
}
function addSubhead(root, tracks, sec) {
  const sub = el('div','c-subhead', esc(sec.slide.subhead || ''));
  root.appendChild(sub);
  tracks.push(blurIn(sub, 0.6, 0.6, 14));
}
/* when the voice is done with the list: the focus hands back to the highlight */
const settleAt = (sec, times) =>
  Math.max(times.length ? times[times.length - 1] + 2.2 : 0,
           sec.audioStart - sec.start + sec.audioDur - 3.0);

/* ---------- section renderers ----------
   Each builder lays out as before, then registers:
     tracks  - fn(localT) that pose its elements
     cam     - [{el, at}] where the push should head, and when */
function buildTitle(sec, root, tracks, cam) {
  addEyebrow(root, tracks, sec);
  const h = addHeadline(root, tracks, sec, 't-headline', 186);
  cam.push({ el: h, at: 0 });
  const isWatch = /^Watch:/i.test(sec.slide.subhead || '');
  if (isWatch) {
    const lab = el('div','watch-label','WATCH FROM HERE');
    lab.style.top = '560px';
    root.appendChild(lab);
    tracks.push(blurIn(lab, 0.85, 0.5, 12));
    const chips = el('div','watch-chips');
    chips.style.top = '634px';
    root.appendChild(chips);
    const labels = sec.slide.subhead.replace(/^Watch:\s*/i,'').split('·').map(c => c.trim());
    const times = cueTimes(sec, labels, { from: 1.2 });
    const items = labels.map((c, k) => {
      const chip = el('div','watch-chip', esc(c));
      chips.appendChild(chip);
      tracks.push(rise(chip, times[k], 0.55, 22));
      cam.push({ el: chip, at: times[k] });
      return addFocus(chip, false);
    });
    tracks.push(focusTrack(items, times, -1, settleAt(sec, times)));
  } else {
    const sub = el('div','t-subhead', esc(sec.slide.subhead || ''));
    sub.style.top = '560px';
    root.appendChild(sub);
    tracks.push(blurIn(sub, 0.75, 0.6, 14));
    if (sec.slide.highlight) {
      const pill = el('div','t-pill', esc(sec.slide.highlight));
      pill.style.top = '668px';
      root.appendChild(pill);
      tracks.push(rise(pill, 1.1, 0.6, 16));
    }
  }
  addFooter(root, tracks, sec, 1.35);
}

function fmtBarValue(v) {
  const sign = v < 0 ? '-' : '', a = Math.abs(v);   // '-$59M', never '$-59M'
  if (a >= 1e9) return sign + '$' + (a/1e9).toFixed(1) + 'B';
  if (a >= 1e6) return sign + '$' + (a/1e6).toFixed(0) + 'M';
  return String(v);
}
function buildBarChart(sec, root, tracks, cam) {
  addEyebrow(root, tracks, sec);
  addHeadline(root, tracks, sec, 'c-headline', 158);
  addSubhead(root, tracks, sec);

  const wrap = el('div','bars');
  root.appendChild(wrap);
  const entries = dataEntries(sec.slide);
  // Scale across the full range so positives and negatives share one zero baseline.
  // Scaling by max alone made a negative value clamp to a stub at the axis, which
  // silently deleted the point of the slide (CALM's Q4 loss, EAF's operating cash burn).
  const vals = entries.map(([,v]) => +v);
  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const range = (hi - lo) || 1;
  const zeroFrac = (0 - lo) / range;
  if (lo < 0) {
    const zl = el('div','bar-zero');
    wrap.appendChild(zl);
    tracks.push(t => {
      zl.style.bottom = (56 + zeroFrac * (wrap.clientHeight - 56 - 60)) + 'px';
      zl.style.opacity = eoq(seg(t, 0.6, 0.5));
    });
  }
  const times = cueTimes(sec, entries.map(([k]) => k));
  const items = [];
  entries.forEach(([k, v], i) => {
    const hl = k === sec.slide.highlight;
    const neg = (+v) < 0;
    const col = el('div','barcol');
    const bar = el('div', 'bar' + (hl ? ' hl' : '') + (neg ? ' neg' : ''));
    const val = el('div', 'bar-val' + (hl ? ' hl' : '') + (neg ? ' neg' : ''));
    const x = el('div', 'bar-x' + (hl ? ' hl' : ''), esc(k));
    col.appendChild(bar); col.appendChild(val); col.appendChild(x);
    wrap.appendChild(col);
    items.push(addFocus(col, false));
    const frac = Math.abs(+v) / range;
    const d = times[i];
    cam.push({ el: col, at: d });
    tracks.push(t => {
      const p = eoq(seg(t, d, 1.0));
      const hMax = col.clientHeight - 56 - 60;      // reserve label + x row
      const zero = 56 + zeroFrac * hMax;           // baseline, above the x-label row
      const h = Math.max(4, frac * hMax * p);
      bar.style.height = h + 'px';
      bar.style.opacity = p === 0 ? 0 : 1;
      bar.style.bottom = (neg ? zero - h : zero) + 'px';
      // A negative bar can reach the x-label row, so its value sits in the empty
      // space above the baseline rather than under the bar, where it would collide.
      val.style.bottom = (neg ? zero + 16 : zero + h + 16) + 'px';
      val.style.opacity = p < 0.15 ? 0 : 1;
      val.textContent = fmtBarValue(+v * p);
    });
    tracks.push(fadeIn(x, 0.7 + i*0.08, 0.5));   // the axis is there before the bars
  });
  const hold = entries.findIndex(([k]) => k === sec.slide.highlight);
  tracks.push(focusTrack(items, times, hold, settleAt(sec, times)));
  addFooter(root, tracks, sec, 1.6);
}

function buildLineChart(sec, root, tracks, cam) {
  addEyebrow(root, tracks, sec);
  addHeadline(root, tracks, sec, 'c-headline', 158);
  addSubhead(root, tracks, sec);

  const wrap = el('div','linewrap');
  root.appendChild(wrap);
  const entries = dataEntries(sec.slide);
  const vals = entries.map(([,v]) => +v);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const W = 1620, H0 = 60, H1 = 330;                 // plot band inside wrap (px from top)
  const X = i => entries.length === 1 ? 0 : i * (W / (entries.length - 1));
  const Y = v => H1 - ((v - lo) / (hi - lo || 1)) * (H1 - H0);

  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox', `0 0 ${W} 420`);
  // cumulative length at each point, so the stroke can be drawn point by point
  const pts = entries.map(([,v], i) => [X(i), Y(+v)]);
  const cum = [0];
  for (let i = 1; i < pts.length; i++)
    cum.push(cum[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  const L = cum[cum.length-1] || 1;
  let dstr = '';
  pts.forEach(([x, y], i) => { dstr += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); });
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', dstr);
  path.setAttribute('fill','none');
  path.setAttribute('stroke','url(#lg)');
  path.setAttribute('stroke-width','11');
  path.setAttribute('stroke-linecap','round');
  path.setAttribute('stroke-linejoin','round');
  path.setAttribute('pathLength','1');
  path.style.strokeDasharray = '1';
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `<linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#6098fa"/></linearGradient>`;
  svg.appendChild(defs);
  svg.appendChild(path);
  const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
  dot.setAttribute('r','11');
  dot.setAttribute('fill','#6098fa');
  svg.appendChild(dot);
  wrap.appendChild(svg);

  const lastX = pts[pts.length-1][0], lastY = pts[pts.length-1][1];
  const lbl = el('div','line-lbl');
  lbl.style.left = (lastX) + 'px';
  lbl.style.top = (lastY) + 'px';
  wrap.appendChild(lbl);

  const xrow = el('div','line-xrow');
  wrap.appendChild(xrow);
  const times = cueTimes(sec, entries.map(([k]) => k));
  entries.forEach(([k], i) => {
    const x = el('div','line-x', esc(k));
    x.style.left = (X(i) / W * 100) + '%';
    if (i === entries.length - 1) { x.style.left=''; x.style.right='0'; x.style.transform='none'; }
    xrow.appendChild(x);
    tracks.push(fadeIn(x, 0.7 + i*0.08, 0.5));
    cam.push({ el: x, at: times[i] });
  });

  // The endpoint label used to hardcode '%', which silently mangled every absolute-value
  // series: MGPI's barrel inventory drew '325,554,000%'. Percentage series never exceed 100
  // and money series are tagged in millions or more, so magnitude separates them cleanly.
  const last = vals[vals.length-1];
  const target = Math.max(...vals.map(Math.abs)) >= 1e6
    ? fmtBarValue(last)
    : last.toFixed(1) + '%';
  const spec = parseCountable(target);
  const tEnd = times[times.length-1];
  tracks.push(t => {
    /* the line reaches point i at its cue, and the dot rides its head */
    let k = 0; while (k + 1 < times.length && t >= times[k + 1]) k++;
    const span = k + 1 < times.length ? times[k+1] - times[k] : 1;
    const f = t < times[0] ? 0 : k + 1 < times.length ? eio(seg(t, times[k], Math.min(span, 1.2))) : 1;
    const len = t < times[0] ? 0 : (cum[k] + (k + 1 < cum.length ? (cum[k+1] - cum[k]) * f : 0)) / L;
    path.style.strokeDashoffset = String(1 - len);
    const i1 = Math.min(k + 1, pts.length - 1);
    const hx = pts[k][0] + (pts[i1][0] - pts[k][0]) * (i1 === k ? 0 : f);
    const hy = pts[k][1] + (pts[i1][1] - pts[k][1]) * (i1 === k ? 0 : f);
    dot.setAttribute('cx', hx); dot.setAttribute('cy', hy);
    dot.setAttribute('r', String(11 * eoc(seg(t, times[0], 0.3))));
    const dp = eoc(seg(t, tEnd + 0.3, 0.5));
    lbl.style.opacity = dp;
    lbl.textContent = countText(spec, eoc(seg(t, tEnd + 0.3, 0.6)));
  });
  addFooter(root, tracks, sec, 1.6);
}

function chipColor(change) {
  const s = String(change).toLowerCase();
  if (/^\+/.test(s) || /ahead|record|added|unchanged at|beat/.test(s)) return 'var(--data-positive)';
  if (/^-/.test(s) || /down |miss/.test(s)) return 'var(--data-negative)';
  return '#8593aa';
}
function buildMetricCards(sec, root, tracks, cam) {
  addEyebrow(root, tracks, sec);
  addHeadline(root, tracks, sec, 'c-headline', 158);
  addSubhead(root, tracks, sec);

  const grid = el('div','cards');
  root.appendChild(grid);
  const entries = dataEntries(sec.slide);
  const times = cueTimes(sec, entries.map(([k]) => k));
  const items = entries.map(([k, obj], i) => {
    const hl = k === sec.slide.highlight;
    const card = el('div','card' + (hl ? ' hl' : ''));
    card.appendChild(el('div','lb', esc(k)));
    const vl = el('div','vl');
    card.appendChild(vl);
    const ch = el('div','ch', esc(obj.change || ''));
    ch.style.color = chipColor(obj.change || '');
    card.appendChild(ch);
    grid.appendChild(card);
    const d = times[i];
    cam.push({ el: card, at: d });
    tracks.push(rise(card, d, 0.6, 30));
    tracks.push(countUp(vl, obj.value, d + 0.15, 1.1));
    tracks.push(fadeIn(ch, d + 0.9, 0.45));
    return addFocus(card, false);
  });
  const hold = entries.findIndex(([k]) => k === sec.slide.highlight);
  tracks.push(focusTrack(items, times, hold, settleAt(sec, times)));
  addFooter(root, tracks, sec, 1.7);
}

const SCENARIO_COLORS = { bear:'var(--red-400)', base:'var(--blue-400)',
  bull:'var(--green-400)', street:'#8593aa' };
function buildDual(sec, root, tracks, cam) {
  addEyebrow(root, tracks, sec);
  addHeadline(root, tracks, sec, 'c-headline', 158);
  addSubhead(root, tracks, sec);

  /* left: bullets, each on its cue */
  const list = el('div','bullets');
  root.appendChild(list);
  const bullets = sec.slide.bullets || [];
  const bTimes = cueTimes(sec, bullets);
  const bItems = bullets.map((b, i) => {
    const hl = b === sec.slide.highlight;
    const scen = b.match(/^(Bear|Base|Bull|Street)(\s*~?\$?[\d.]*)\s*:?\s*(.*)$/);
    const item = el('div','bullet' + (hl ? ' hl' : ''));
    if (scen) {
      const col = SCENARIO_COLORS[scen[1].toLowerCase()];
      item.innerHTML = `<span class="mk">-</span><span class="sc" style="color:${col}">` +
        esc(scen[1] + scen[2]) + `</span>` + esc(scen[3]);
    } else {
      item.innerHTML = `<span class="mk">-</span>` + esc(b);
    }
    list.appendChild(item);
    const d = bTimes[i];
    cam.push({ el: item, at: d });
    tracks.push(t => { const p = eoc(seg(t, d, 0.6));
      item.style.opacity = p;
      item.style.transform = `translateX(${(1-p)*-30}px)`; });
    return addFocus(item, false);
  });
  const bHold = bullets.findIndex(b => b === sec.slide.highlight);
  tracks.push(focusTrack(bItems, bTimes, bHold, settleAt(sec, bTimes)));

  /* right: <=4 entries -> 2x2 minis; >4 -> stat panel. Stats cue on their own
     labels; the narration often names them between bullets. */
  const entries = dataEntries(sec.slide);
  const sTimes = cueTimes(sec, entries.map(([k]) => k));
  let sItems;
  if (entries.length <= 4) {
    const grid = el('div','ministats');
    root.appendChild(grid);
    const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9$%]/g,'');
    const hlNorm = norm(sec.slide.highlight);
    /* highlight may name a bullet instead of a data key: then spotlight the lead stat */
    const hlIsBullet = bullets.some(b => norm(b) === hlNorm);
    sItems = entries.map(([k, v], i) => {
      const kNorm = norm(k);
      const hl = hlNorm && (hlNorm.startsWith(kNorm) || kNorm.startsWith(hlNorm) ||
                            (i === 0 && hlIsBullet));
      const m = el('div','mini' + (hl ? ' hl' : ''));
      m.appendChild(el('div','lb', esc(k)));
      const st = splitValue(v);
      const vl = el('div','vl');
      m.appendChild(vl);
      const d = sTimes[i];
      buildValue(vl, st.main, d + 0.15, 1.05, tracks);
      if (st.note) {
        const sb = el('div','sb' + (/\d/.test(st.note) ? ' warm' : ''), esc(st.note));
        m.appendChild(sb);
        tracks.push(fadeIn(sb, d + 0.55, 0.45));
      }
      grid.appendChild(m);
      cam.push({ el: m, at: d });
      tracks.push(rise(m, d, 0.6, 30));
      return addFocus(m, false);
    });
  } else {
    const panel = el('div','statpanel');
    root.appendChild(panel);
    tracks.push(rise(panel, Math.max(0.9, sTimes[0] - 0.4), 0.6, 24));
    sItems = entries.map(([k, v], i) => {
      const hl = sec.slide.highlight === k;
      const row = el('div','staterow' + (hl ? ' hl' : ''));
      row.appendChild(el('div','lb', esc(k)));
      const parts = String(v).match(/^(.*?)\s*\((.*)\)\s*$/);
      const vl = el('div','vl');
      vl.innerHTML = esc(parts ? parts[1] : String(v)) +
        (parts ? ` <span class="paren">(${esc(parts[2])})</span>` : '');
      row.appendChild(vl);
      panel.appendChild(row);
      cam.push({ el: row, at: sTimes[i] });
      tracks.push(rise(row, sTimes[i], 0.55, 18));
      return addFocus(row, false);
    });
  }
  tracks.push(focusTrack(sItems, sTimes, -1, settleAt(sec, sTimes)));
  addFooter(root, tracks, sec, 1.8);
}

/* highlight tone for table rows: green unless the slide says otherwise */
const TBL_TONE = {
  negative: ['var(--data-negative)', 'rgba(249,128,128,.07)'],
  warning:  ['var(--data-warning)',  'rgba(255,138,76,.07)'],
  positive: ['var(--data-positive)', 'rgba(49,196,141,.07)'],
};
function buildTable(sec, root, tracks, cam) {
  addEyebrow(root, tracks, sec);
  addHeadline(root, tracks, sec, 'c-headline', 158);
  addSubhead(root, tracks, sec);

  const data = sec.slide.data || {};
  const cols = data.columns || [];
  const rows = data.rows || [];
  const [toneColor, toneBg] = TBL_TONE[sec.slide.tone] || TBL_TONE.positive;

  const wrap = el('div','tbl');
  const head = el('div','tbl-head');
  cols.forEach((c, j) => {
    head.appendChild(el('div',
      'th' + (j === 0 ? ' c0' : ' c') + (j === cols.length - 1 ? ' last' : ''), esc(c)));
  });
  wrap.appendChild(head);
  const rule = el('div','tbl-rule');
  wrap.appendChild(rule);
  tracks.push(rise(head, 0.8, 0.5, 14));
  tracks.push(t => { rule.style.transformOrigin = 'left';
    rule.style.transform = `scaleX(${eio(seg(t, 0.9, 0.7))})`; });

  /* Fit the rows to the space between the table top (430px) and the footer rule.
     The old fixed ramp stopped shrinking at 6 rows, so a 7-row table overflowed and
     collided with the source line and the logo. Compute the padding instead, and drop
     the row font once even zero padding would not fit. */
  const AVAIL = 470, HEAD = 47;
  const rowFont = rows.length >= 8 ? 26 : rows.length === 7 ? 29 : 0;   // 0 = CSS default
  const lineH = rowFont ? Math.round(rowFont * 1.2) : 41;
  const padV = Math.max(6, Math.min(27,
    Math.floor((AVAIL - HEAD - rows.length * lineH) / (2 * rows.length))));
  const times = cueTimes(sec, rows.map(r => r[0]), { from: 1.3 });
  const items = rows.map((r, i) => {
    const hl = sec.slide.highlight && r[0] === sec.slide.highlight;
    const row = el('div','tbl-row');
    row.style.padding = `${padV}px 36px`;
    const f = addFocus(row);
    r.forEach((cell, j) => {
      const cls = (j === 0 ? 'td0 c0' : 'td c') + (j === r.length - 1 ? ' last' : '');
      const td = el('div', cls, esc(cell));
      if (rowFont) td.style.fontSize = (j === 0 ? rowFont + 3 : rowFont) + 'px';
      if (hl && (j === 0 || j === r.length - 1)) {
        td.style.color = toneColor; td.style.fontWeight = '600';
      }
      row.appendChild(td);
    });
    if (hl) row.style.background = toneBg;
    wrap.appendChild(row);
    cam.push({ el: row, at: times[i] });
    tracks.push(t => { const p = eoc(seg(t, times[i], 0.55));
      row.style.opacity = p;
      row.style.transform = `translateX(${(1-p)*-24}px)`; });
    return f;
  });
  const hold = rows.findIndex(r => sec.slide.highlight && r[0] === sec.slide.highlight);
  tracks.push(focusTrack(items, times, hold, settleAt(sec, times)));
  root.appendChild(wrap);
  addFooter(root, tracks, sec, 1.8);
}

const TONE = {
  warning:  'var(--data-warning)',
  negative: 'var(--data-negative)',
  positive: 'var(--data-positive)',
  neutral:  'var(--accent)',
};
function buildCallout(sec, root, tracks, cam) {
  addEyebrow(root, tracks, sec);
  const color = TONE[sec.slide.tone] || TONE.neutral;

  const kicker = el('div','k-kicker', esc((sec.slide.subhead || '').toUpperCase()));
  kicker.style.top = '308px';
  root.appendChild(kicker);
  tracks.push(blurIn(kicker, 0.35, 0.6, 14));

  const big = el('div','k-big', esc(sec.slide.headline));
  big.style.top = '392px';
  big.style.color = color;
  root.appendChild(big);
  big.classList.add('autofit');
  cam.push({ el: big, at: 0 });
  const spec = parseCountable(sec.slide.headline);
  if (spec) {
    tracks.push(t => {
      const p = eoc(seg(t, 0.65, 1.3));
      big.style.opacity = clamp01(p * 3);
      big.style.transform = `translateY(${(1 - eoc(seg(t, 0.65, 0.6))) * 30}px)`;
      big.textContent = p >= 1 ? sec.slide.headline : countText(spec, p);
    });
  } else {
    /* a word, not a number: blur in word by word like a headline */
    big.textContent = '';
    String(sec.slide.headline).split(' ').forEach((w, k, all) => {
      const s = el('span','w', esc(w));
      s.style.display = 'inline-block';
      big.appendChild(s);
      if (k < all.length - 1) big.appendChild(document.createTextNode(' '));
      tracks.push(blurIn(s, 0.65 + k*0.1, 0.7, 26));
    });
  }
  const rule = el('div','k-rule');
  rule.style.top = '628px';
  root.appendChild(rule);
  tracks.push(t => { rule.style.transform = `scaleX(${eio(seg(t, 1.7, 0.6))})`; });

  const ctx = el('div','k-ctx', esc(sec.slide.data && sec.slide.data.context || ''));
  ctx.style.top = '672px';
  root.appendChild(ctx);
  tracks.push(blurIn(ctx, 1.9, 0.7, 16));
  addFooter(root, tracks, sec, 2.2);
}

function buildCTA(sec, root, tracks, cam) {
  const mark = el('div','cta-mark');
  mark.style.top = '212px';
  mark.innerHTML = `<img src="${DATA.markSrc}">`;
  root.appendChild(mark);
  tracks.push(rise(mark, 0.25, 0.7, 24));

  const word = el('div','cta-word', esc(sec.slide.headline));
  word.style.top = '392px';
  root.appendChild(word);
  word.classList.add('autofit');
  cam.push({ el: word, at: 0 });
  tracks.push(blurIn(word, 0.5, 0.7, 24));

  const sub = el('div','cta-sub', esc(sec.slide.subhead || ''));
  sub.style.top = '596px';
  root.appendChild(sub);
  tracks.push(blurIn(sub, 0.9, 0.6, 16));

  const btn = el('div','cta-btn');
  btn.style.top = '760px';
  btn.innerHTML = `<span>${esc(sec.slide.headline)}</span>`;
  root.appendChild(btn);
  tracks.push(rise(btn, 1.3, 0.6, 18));

  const fine = el('div','cta-fine','Not investment advice · No price targets · Every number from the filings');
  root.appendChild(fine);
  tracks.push(fadeIn(fine, 1.7, 0.6));
}

const BUILDERS = {
  title: buildTitle, callout: buildCallout, cta: buildCTA,
  bar: buildBarChart, line: buildLineChart, table: buildTable,
  metric_cards: buildMetricCards, dual: buildDual,
};
function builderFor(sec) {
  if (sec.visual_ref === 'cta') return BUILDERS.cta;
  if (sec.visual_type === 'title') return BUILDERS.title;
  if (sec.visual_type === 'callout') return BUILDERS.callout;
  if (sec.visual_type === 'dual') return BUILDERS.dual;
  if (sec.visual_type === 'chart') return BUILDERS[sec.slide.chart_type] || BUILDERS.metric_cards;
  return BUILDERS.title;
}

/* ---------- init + seek ---------- */
const sections = [];   // { node, cam, tracks, start, dur, shots }

function autofit() {
  document.querySelectorAll('.autofit').forEach(n => {
    const nowrap = getComputedStyle(n).whiteSpace === 'nowrap';
    let fs = parseFloat(getComputedStyle(n).fontSize);
    const fits = () => nowrap
      ? n.scrollWidth <= n.clientWidth + 2
      : n.scrollHeight <= fs * 1.07 * 2 + 10;    // wrapped headlines: max 2 lines
    while (!fits() && fs > 40) { fs -= 2; n.style.fontSize = fs + 'px'; }
  });
  /* shrink any stat value that overflows its card */
  document.querySelectorAll('.mini .vl, .card .vl, .staterow .vl').forEach(n => {
    let fs = parseFloat(getComputedStyle(n).fontSize);
    const limit = n.parentElement.clientWidth -
      (parseFloat(getComputedStyle(n.parentElement).paddingLeft) || 0) -
      (parseFloat(getComputedStyle(n.parentElement).paddingRight) || 0);
    while (n.scrollWidth > Math.max(120, limit) && fs > 26) {
      fs -= 2; n.style.fontSize = fs + 'px';
    }
  });
}

/* the push: a slow scale toward whatever the voice is on. Its origin eases from
   one target's centre to the next at each cue, so the frame drifts with the
   narration instead of sitting still like a slide. */
const PUSH = 0.045, PAN = 1.1;
function camPose(s, lt) {
  let ox = 960, oy = 560;
  for (const sh of s.shots) {
    if (lt < sh.at) break;
    const k = eio(seg(lt, sh.at, PAN));
    ox += (sh.x - ox) * k; oy += (sh.y - oy) * k;
  }
  const k = PUSH * eio(seg(lt, 0.2, s.dur));
  s.cam.style.transformOrigin = `${ox.toFixed(1)}px ${oy.toFixed(1)}px`;
  s.cam.style.transform = `scale(${(1 + k).toFixed(5)})`;
}

window.__init = async function() {
  /* force every face to load BEFORE building + measuring: fonts.ready alone
     resolves early because no text uses the faces yet */
  const faces = [];
  for (const w of [400,500,600,700,800,900]) faces.push(`${w} 20px Orbitron`);
  for (const w of [300,400,500,600,700]) faces.push(`${w} 20px "Space Grotesk"`);
  await Promise.all(faces.map(f => document.fonts.load(f, 'RoboSystems $12.56B')));
  await document.fonts.ready;
  const host = document.getElementById('sections');
  DATA.sections.forEach((sec, i) => {
    const node = el('div','slide');
    const cam = el('div','cam');
    node.appendChild(cam);
    const tracks = [], targets = [];
    builderFor(sec)(sec, cam, tracks, targets);
    host.appendChild(node);
    const next = DATA.sections[i + 1];
    const dur = (next ? next.start : DATA.total) - sec.start + TRANS;
    sections.push({ node, cam, tracks, targets, start: sec.start, dur, sec });
  });
  autofit();
  /* measure the push targets untransformed, in stage px */
  const stage = document.getElementById('stage').getBoundingClientRect();
  sections.forEach(s => {
    s.shots = s.targets.map(({ el: n, at }) => {
      const r = n.getBoundingClientRect();
      return { at, x: r.left - stage.left + r.width / 2, y: r.top - stage.top + r.height / 2 };
    }).sort((a, b) => a.at - b.at);
  });
  window.__seek(0);
  window.__READY = true;
  return true;
};

const TRANS = 0.5;
window.__total = () => DATA.total;

window.__seek = function(t) {
  t = Math.max(0, Math.min(t, DATA.total));

  /* active section */
  let a = 0;
  for (let i = 0; i < sections.length; i++) if (sections[i].start <= t) a = i;

  sections.forEach((s, i) => {
    const show = i === a || (i === a - 1 && t < sections[a].start + TRANS);
    if (!show) { s.node.style.display = 'none'; return; }
    /* the hook builds once the poster has dissolved, never underneath it */
    const lt = i === 0 && DATA.posterHold > 0 ? t - DATA.posterHold - 0.2 : t - s.start;
    s.node.style.display = 'block';
    let o = 1;
    if (i === a && i > 0) o = eoc(clamp01(lt / TRANS));
    if (i === a - 1) o = 1 - eoc(clamp01((t - sections[a].start) / TRANS));
    /* the last shot fades its content into the backdrop, never to black */
    if (i === sections.length - 1) o *= 1 - eio(seg(t, DATA.total - 0.9, 0.9));
    s.node.style.opacity = o;
    camPose(s, lt);
    s.tracks.forEach(fn => fn(lt));
  });

  /* poster: frame 0 is the thumbnail, then it dissolves into the hook */
  const poster = document.getElementById('poster');
  if (DATA.posterHold > 0 && t < DATA.posterHold + 0.35) {
    poster.style.display = 'block';
    poster.style.opacity = 1 - eio(seg(t, DATA.posterHold, 0.35));
  } else {
    poster.style.display = 'none';
  }
};
</script>
</body>
