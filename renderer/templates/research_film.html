<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Research film</title>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
    </script>
    <link rel="stylesheet" href="/ds/tokens/film.css" />
    <link rel="stylesheet" href="film_stage.css" />
    <style>
      #stage { width: 1920px; height: 1080px; }
      .ctr { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .left { position: absolute; left: 130px; top: 0; bottom: 0; width: 900px; display: flex; flex-direction: column; justify-content: center; }
      .kick { font: 600 26px var(--display); letter-spacing: .3em; text-transform: uppercase; color: var(--c300); }
      .stat { font: 900 230px/1 var(--display); margin-top: 44px; }
      .lab { font: 500 40px var(--body); color: var(--soft); margin-top: 22px; }
      .quote { font: 500 50px/1.3 var(--body); max-width: 1400px; }
      .by { font: 600 22px var(--display); letter-spacing: .24em; text-transform: uppercase; color: var(--muted); margin-top: 30px; }
      .count { font: 900 150px/1 var(--display); margin-top: 40px; }
      .note12 { font: 800 60px/1.1 var(--display); margin-top: 70px; }
      .cap { position: absolute; left: 160px; right: 160px; bottom: 96px; text-align: center; font: 500 44px/1.3 var(--body); color: var(--ink); }
      /* number: the figure alone, then the same figure against others, to scale */
      .ntop { position: absolute; left: 0; right: 0; top: 0; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; transform-origin: 50% 0; }
      .giant { font: 900 250px/1 var(--display); margin-top: 30px; }
      .nlab { font: 600 30px var(--display); letter-spacing: .26em; text-transform: uppercase; }
      .nbars { position: absolute; left: 200px; right: 200px; top: 500px; }
      .bar { margin-bottom: 40px; }
      .bar .bl { font: 500 32px var(--body); margin-bottom: 12px; }
      .bar .track { position: relative; height: 62px; }
      .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; border-radius: 6px; }
      .bar.other .fill { background: #04070c; }
      .bar .bv { position: absolute; top: 0; font: 800 44px/62px var(--display); margin-left: 22px; }
      .ncap { position: absolute; left: 0; right: 0; bottom: 60px; text-align: center; font: 600 30px var(--display); letter-spacing: .26em; text-transform: uppercase; }
      /* number with columns: values side by side from one baseline, and a line they are read against */
      .cols { position: absolute; left: 260px; right: 260px; top: 430px; height: 470px; }
      .col { position: absolute; bottom: 0; width: 190px; }
      .col .cfill { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 6px 6px 0 0; }
      .col .cv { position: absolute; left: -40px; right: -40px; text-align: center; font: 800 40px var(--display); }
      .col .cl { position: absolute; left: -60px; right: -60px; top: 100%; margin-top: 14px; text-align: center; font: 500 28px var(--body); }
      .refline { position: absolute; left: -60px; right: -60px; height: 0; border-top: 5px dashed #04070c; transform-origin: 0 50%; }
      .reflab { position: absolute; right: -60px; font: 800 40px var(--display); color: #04070c; text-align: right; }
      .reflab small { display: block; font: 600 22px var(--display); letter-spacing: .2em; text-transform: uppercase; margin-top: 6px; }
      .rows { position: absolute; left: 200px; right: 200px; top: 210px; }
      .row { display: flex; align-items: baseline; justify-content: space-between; border-top: 1px solid rgba(255,255,255,.22); padding: 40px 0 34px; }
      .row .rl { font: 500 46px var(--body); } .row .rs { font: 500 28px var(--body); color: var(--muted); margin-top: 12px; max-width: 860px; }
      .row .rv { font: 800 76px var(--display); white-space: nowrap; }
      .prompt { font: 500 46px/1.35 var(--body); max-width: 1380px; margin-top: 44px; }
      .mark { display: flex; align-items: center; gap: 22px; margin-top: 70px; }
      .mark img { width: 84px; height: 84px; border-radius: 20px; } .mark span { font: 800 46px var(--display); }
      .url { font: 500 34px var(--body); color: var(--c300); margin-top: 26px; }
      .fine { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font: 500 24px var(--body); color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="gl" width="1920" height="1080"></canvas></div>
    <script type="module">
      // The type layer of a research film (tools/research_film/build.py; projects/<TICKER>/film/).
      // A template: the film's spec lists its scenes, and each names a kind and carries its own
      // words, figures and cue names. Nothing here belongs to one company.
      //
      //   data.scenes: { <scene name, as the acts name it>: { kind, at: { slot: cue }, ...content } }
      //
      //   stat    { kicker, stat, statlab, quote?, quoteby? }      at: kicker, stat, quote
      //           the reading everyone has: one figure, then a sourced line said about it
      //   ident   { kicker, facts, factlab, note, quote }          at: open, note, push, quote
      //           over the kit's filing ident; the count is the filing's own fact count
      //   number  { label, value, caption?, bars | columns + line } at: number, caption, line
      //           the turn: one figure, then against others, to scale. bars: [{ label, text,
      //           amount, at, delay?, other? }] run across; columns: [{ label, text, amount }]
      //           stand on one baseline (at.columns) under line: { text, label, amount }
      //   rows    { kicker, rows: [{ label, value, sub, at }] }
      //   quote   { quote, by, line? }                             at: quote, line
      //   ask     { kicker, prompt, url, note }                    at: ask
      //
      // A scene's "stage" overrides where it plays: field, plate, flood, grid or graph.
      // The stage, the lens and the colours are the film kit's (film_stage.js).
      import { stage, fonts, seg, eo, eio, lerp, show, $ } from './film_stage.js'

      const TL = await (await fetch('/film/timeline.json')).json()
      const W = 1920, H = 1080, C = TL.cues, SC = TL.scenes.map((s) => ({ ...TL.data.scenes[s.name], name: s.name, a: s.start, b: s.end }))
      const clamp = (x) => Math.max(0, Math.min(1, x))
      const { scene, cam, composer, bloom, DARK, BLACK, FLOOD, THREE, dust, nodes, edgeMat, globe, setNodes, floor, floorMat } = stage({ W, H, canvas: $('gl') })
      const STAGE = { stat: 'field', ident: 'plate', number: 'flood', rows: 'grid', quote: 'grid', ask: 'graph' }
      const FLOOR = { rows: 0.5, quote: 0.35 }
      const el = (parent, cls, text) => { const e = document.createElement('div'); e.className = cls; if (text != null) e.textContent = text; parent.appendChild(e); return e }

      // each kind builds its overlay once and returns how to draw it at a time
      const KIND = {
        stat(o, s) {
          const c1 = el(o, 'ctr'), k = el(c1, 'kick', s.kicker), st = el(c1, 'stat', s.stat), l = el(c1, 'lab', s.statlab)
          const c2 = el(o, 'ctr'), q = el(c2, 'quote', s.quote ? '“' + s.quote + '”' : ''), by = el(c2, 'by', s.quoteby || '')
          return (t, u, d) => {
            const A = s.at, out = s.quote ? seg(t, C[A.quote] - 0.45, C[A.quote] - 0.1) : seg(u, d - 0.35, d)
            show(k, seg(t, C[A.kicker] - 0.2, C[A.kicker] + 0.5), out, 12); show(st, seg(t, C[A.stat] - 0.1, C[A.stat] + 0.55), out, 30); show(l, seg(t, C[A.stat] + 0.15, C[A.stat] + 0.75), out, 12)
            const qa = s.quote ? C[A.quote] : 1e9
            show(q, seg(t, qa, qa + 0.7), seg(u, d - 0.35, d)); show(by, seg(t, qa + 0.5, qa + 1.1), seg(u, d - 0.35, d), 10)
          }
        },
        ident(o, s) {
          const c = el(o, 'left'), k = el(c, 'kick', s.kicker), n = el(c, 'count'), l = el(c, 'lab', s.factlab), nt = el(c, 'note12', s.note), q = el(o, 'cap', s.quote)
          return (t, u, d) => {
            const A = s.at, out = seg(t, C[A.push] - 0.5, C[A.push] - 0.1)
            show(k, seg(t, C[A.open] - 0.1, C[A.open] + 0.6), out, 12)
            n.textContent = Math.round(s.facts * eo(seg(u, 0.2, 3.0))).toLocaleString('en-US')
            show(n, seg(u, 0.2, 0.8), out, 0); show(l, seg(u, 0.6, 1.2), out, 10)
            show(nt, seg(t, C[A.note] - 0.1, C[A.note] + 0.5), out, 16)
            show(q, seg(t, C[A.quote] - 0.5, C[A.quote] + 0.3), seg(u, d - 0.3, d), 14)
          }
        },
        number(o, s) {
          const top = el(o, 'ntop'), lab = el(top, 'nlab', s.label), val = el(top, 'giant', s.value), cap = el(o, 'ncap', s.caption || '')
          const A = s.at, rows = s.bars || [], cols = s.columns || []
          const max = Math.max(...rows.map((b) => b.amount), ...cols.map((b) => b.amount), s.line ? s.line.amount : 0), BW = W - 400 - 260
          const bars = el(o, 'nbars'), B = rows.map((b) => { const r = el(bars, 'bar' + (b.other ? ' other' : '')); el(r, 'bl', b.label); const tr = el(r, 'track'); return { r, f: el(tr, 'fill'), v: el(tr, 'bv', b.text) } })
          const cw = el(o, 'cols'), CH = 470, step = cols.length ? (W - 520) / cols.length : 0
          const K = cols.map((c, i) => { const r = el(cw, 'col'); r.style.left = i * step + (step - 190) / 2 + 'px'; return { r, f: el(r, 'cfill'), v: el(r, 'cv', c.text), l: el(r, 'cl', c.label) } })
          const rl = s.line ? el(cw, 'refline') : null, rt = s.line ? el(cw, 'reflab') : null
          if (rt) { rt.textContent = s.line.text; el(rt, '', s.line.label).outerHTML = `<small>${s.line.label}</small>` }
          const first = rows.length ? C[rows[0].at] : cols.length ? C[A.columns] : 1e9
          return (t) => {
            const p = seg(t, C[A.number] - 0.05, C[A.number] + 0.6), up = eio(seg(t, first - 0.7, first + 0.1))
            show(val, p, 0, 40); show(lab, seg(t, C[A.number] + 0.5, C[A.number] + 1.1), 0, 10)
            top.style.transform = `translateY(${lerp(0, 70, up)}px) scale(${lerp(1, 0.62, up) * lerp(1.1, 1, eo(p))})`; top.style.height = lerp(1080, 560, up) + 'px'
            rows.forEach((bar, i) => { const at = C[bar.at] + (bar.delay || 0), g = eo(seg(t, at, at + 0.9)), w = (bar.amount / max) * BW * g
              B[i].r.style.opacity = clamp(seg(t, at - 0.15, at + 0.25)); B[i].f.style.width = w + 'px'; B[i].v.style.left = w + 'px' })
            cols.forEach((c, i) => { const at = first + i * 0.35, g = eo(seg(t, at, at + 0.9)), h = (c.amount / max) * CH * g
              K[i].r.style.opacity = clamp(seg(t, at - 0.15, at + 0.25)); K[i].f.style.height = h + 'px'; K[i].v.style.bottom = h + 12 + 'px' })
            if (rl) { const at = C[A.line], g = eo(seg(t, at, at + 0.8)), y = CH - (s.line.amount / max) * CH
              rl.style.top = y + 'px'; rl.style.opacity = clamp(seg(t, at - 0.1, at + 0.2)); rl.style.transform = `scaleX(${g})`; rt.style.top = y - 112 + 'px'; show(rt, seg(t, at + 0.3, at + 0.9), 0, 10) }
            show(cap, s.caption ? seg(t, C[A.caption] - 0.1, C[A.caption] + 0.5) : 0, 0, 10)
          }
        },
        rows(o, s) {
          const k = el(o, 'kick', s.kicker); Object.assign(k.style, { position: 'absolute', left: '200px', top: '130px' })
          const w = el(o, 'rows'), R = s.rows.map((r) => { const row = el(w, 'row'), a = el(row, ''); el(a, 'rl', r.label); el(a, 'rs', r.sub); el(row, 'rv', r.value); return row })
          return (t, u, d) => { show(k, seg(u, 0.1, 0.7), seg(u, d - 0.3, d), 10); s.rows.forEach((r, i) => show(R[i], seg(t, C[r.at] - 0.15, C[r.at] + 0.45), seg(u, d - 0.3, d), 20)) }
        },
        quote(o, s) {
          const c = el(o, 'ctr'), q = el(c, 'quote', s.quote), by = el(c, 'by', s.by), l = el(c, 'note12', s.line || ''); l.style.marginTop = '90px'
          return (t, u, d) => { const A = s.at
            show(q, seg(t, C[A.quote] - 0.2, C[A.quote] + 0.5), seg(u, d - 0.3, d)); show(by, seg(t, C[A.quote] + 0.4, C[A.quote] + 1.0), seg(u, d - 0.3, d), 10)
            show(l, s.line ? seg(t, C[A.line] - 0.1, C[A.line] + 0.5) : 0, seg(u, d - 0.3, d), 16) }
        },
        ask(o, s) {
          const c = el(o, 'ctr'), k = el(c, 'kick', s.kicker), p = el(c, 'prompt', s.prompt), m = el(c, 'mark'), url = el(c, 'url', s.url), n = el(o, 'fine', s.note); k.style.fontSize = '34px'
          m.innerHTML = '<img src="/ds/assets/robosystems_icon.png" /><span>RoboSystems</span>'
          return (t, u) => { const a = C[s.at.ask]
            show(k, seg(t, a - 0.2, a + 0.5), 0, 12); show(p, seg(t, a + 0.3, a + 1.1), 0, 16)
            show(m, seg(t, a + 1.3, a + 1.9), 0, 10); show(url, seg(t, a + 1.6, a + 2.2), 0, 10); show(n, seg(u, 0.3, 1.0), 0, 0) }
        },
      }
      SC.forEach((s, i) => {
        s.on = s.stage || STAGE[s.kind]
        s.el = el($('stage'), 'ov'); s.draw = KIND[s.kind](s.el, s)
        // a run of grid scenes is one journey over the floor: the camera keeps going through the cut
        s.run = s.on === 'grid' && i && SC[i - 1].on === 'grid' ? SC[i - 1].run : s.a
      })

      function seek(t) {
        const s = SC.find((s) => t >= s.a && t < s.b) || SC[SC.length - 1]
        const u = t - s.a, d = s.b - s.a, k = u / d, on = s.on
        SC.forEach((x) => (x.el.style.opacity = x === s ? 1 : 0))
        scene.background = on === 'plate' ? BLACK : on === 'flood' ? FLOOD : DARK
        scene.fog = on === 'grid' ? new THREE.Fog(DARK, 18, 78) : null
        dust.visible = on !== 'flood' && on !== 'plate'; floor.visible = on === 'grid'; globe.visible = on === 'field' || on === 'flood' || on === 'graph'
        bloom.strength = on === 'flood' ? 0.36 : 0.6
        dust.material.uniforms.uAlpha.value = 0.55; dust.material.uniforms.uAperture.value = 0.08; nodes.material.uniforms.uAlpha.value = 1
        globe.position.set(0, 0, 0); globe.scale.setScalar(1); globe.rotation.set(0.28, t * 0.2, 0.12)
        if (on === 'field') { // scattered facts, the lens pulling focus through them
          cam.position.set(lerp(-1.2, 1.2, eio(k)), 0.3, lerp(14, 9, eio(k))); cam.lookAt(0, 0, -20)
          const f = lerp(10, 26, eio(k)); dust.material.uniforms.uFocus.value = nodes.material.uniforms.uFocus.value = f; nodes.material.uniforms.uAperture.value = 0.08
          globe.rotation.set(0, 0, 0); setNodes(0); edgeMat.opacity = 0
        }
        if (on === 'flood') { // the colour world, held for the turn: the graph fills the frame behind the figure
          setNodes(1); edgeMat.opacity = 0.3; nodes.material.uniforms.uAlpha.value = 0.5; globe.scale.setScalar(2.1)
          cam.position.set(0, 0, lerp(15.5, 13.5, eio(k))); cam.lookAt(0, 0, 0)
          nodes.material.uniforms.uFocus.value = cam.position.z - 5; nodes.material.uniforms.uAperture.value = 0.12
        }
        if (on === 'grid') { // plain statements, travelling forward over the grid
          cam.position.set(0, 3.4, 6 - (t - s.run) * 1.6); cam.lookAt(0, 0.6, cam.position.z - 30); floor.position.set(0, 0, Math.ceil(cam.position.z / 1.5) * 1.5 - 1.5)
          dust.material.uniforms.uFocus.value = 16; floorMat.color.set('#22D3EE').multiplyScalar(0.9); floorMat.opacity = FLOOR[s.kind] ?? 0.35
        }
        if (on === 'graph') { // the graph, quiet, behind the words
          setNodes(1); edgeMat.opacity = 0.12; nodes.material.uniforms.uAlpha.value = 0.26; globe.scale.setScalar(1.9)
          cam.position.set(0, 0, lerp(14, 15.5, eio(k))); cam.lookAt(0, 0, 0); dust.material.uniforms.uFocus.value = 14
          nodes.material.uniforms.uFocus.value = cam.position.z - 4; nodes.material.uniforms.uAperture.value = 0.1
        }
        s.draw(t, u, d, k)
        composer.render()
      }
      window.__init = async () => { await fonts(); window.__READY = true }
      window.__total = () => TL.total
      window.__seek = seek
    </script>
  </body>
</html>
