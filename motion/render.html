<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>RoboLedger video templates</title>
    <style>
      @font-face { font-family: 'Space Grotesk'; src: url('/fonts/SpaceGrotesk/SpaceGrotesk-VariableFont_wght.ttf') format('truetype'); font-weight: 300 700; }
      @font-face { font-family: 'Orbitron'; src: url('/fonts/Orbitron/Orbitron-VariableFont_wght.ttf') format('truetype'); font-weight: 400 900; }
      html, body { margin: 0; background: #000; }
      #host { position: relative; }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <script type="module">
      // Renderer harness for the video templates: render.html?t=intro&data=<json>
      // builds one template from its data and exposes __init / __total / __seek.
      // The landing kit, fonts and logo are mounted from roboledger-app (see README).
      import { mount } from '/demos/kit.js'
      const TEMPLATES = ['intro', 'outro', 'slide']
      const q = new URLSearchParams(location.search)
      const name = q.get('t') || 'intro'
      if (!TEMPLATES.includes(name)) throw new Error(`unknown template "${name}"; expected ${TEMPLATES.join(', ')}`)
      const make = (await import(`./${name}.js`)).default
      const def = make(JSON.parse(q.get('data') || '{}'))
      const host = document.getElementById('host')
      host.style.width = def.width + 'px'
      host.style.height = def.height + 'px'
      let seek
      window.__init = async () => {
        await Promise.all(['700 40px Orbitron', '400 40px "Space Grotesk"', '600 40px "Space Grotesk"'].map((f) => document.fonts.load(f)))
        await document.fonts.ready
        seek = mount(host, def, { autoplay: false }).seek
        window.__READY = true
      }
      window.__total = () => def.total
      window.__seek = (t) => seek(t)
    </script>
  </body>
</html>
