version: 2

updates:
  # Python — uv.lock is committed, so Dependabot maintains the lock as well.
  # This repo has no CI, so a Dependabot PR here gets no automated check:
  # run the pipeline locally before merging one.
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
    groups:
      python-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      python-security:
        applies-to: 'security-updates'
        patterns:
          - '*'

  # npm — each of these directories has its own package-lock.json
  - package-ecosystem: 'npm'
    directories:
      - '/design-system'
      - '/renderer'
      - '/tools/webdeck'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      npm-security:
        applies-to: 'security-updates'
        patterns:
          - '*'
    ignore:
      # renderer/src/short.mjs serves React's UMD builds and calls
      # ReactDOM.render; React 19 removed both, so `short` crashes on it. Lift
      # this when short.mjs moves off them, and move both packages together.
      - dependency-name: 'react'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'react-dom'
        update-types:
          - 'version-update:semver-major'
